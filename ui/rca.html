<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RCA Analysis — IndiaMART BuyLead</title>
<style>
:root, body[data-theme="dark"] {
  --bg:#0a0c14; --surface:#13151f; --surface2:#1a1d2e; --surface3:#1f2235;
  --border:#2d314c; --text:#e8ebf7; --muted:#8a8fb0; --muted2:#6a6f8d;
  --accent:#7282f8;
  --green:#5bf09c; --red:#ff7575; --orange:#ffae6b; --yellow:#ffd97a;
  --purple:#c378ff; --blue:#76aef5; --teal:#6df0d8; --pink:#ff79d4; --grey:#a8aec8;
}
body[data-theme="light"] {
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eaedf5; --surface3:#dde1ec;
  --border:#c9cee0; --text:#0f1424; --muted:#454963; --muted2:#6d7290;
  --accent:#2b39c8;
  --green:#177846; --red:#b9342b; --orange:#a8631d; --yellow:#8a6500;
  --purple:#5e2bb2; --blue:#1f5cc4; --teal:#0f7f72; --pink:#a3217e; --grey:#454963;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top, #14172a 0%, #0a0c14 70%);
  color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;
  min-height:100vh;font-size:14px;font-feature-settings:"cv11","ss01";
}

/* ── Header ─────────────────────────────────────────────────── */
header{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:rgba(13,15,25,.85);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-logo{width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff;}
.brand h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;}
.brand .sub{font-size:.7rem;color:var(--muted);margin-top:1px;}
.status{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:#3a3f5c;}
.dot.ok{background:var(--green);box-shadow:0 0 8px rgba(91,240,156,.6);}

/* ── Input row ─────────────────────────────────────────────── */
.input-row{max-width:1100px;margin:24px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;}
.input-row input{
  flex:1;min-width:240px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:13px 16px;border-radius:10px;font-size:.95rem;
  font-family:'JetBrains Mono','SF Mono',monospace;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,124,242,.18);}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:13px 26px;font-size:.92rem;font-weight:700;cursor:pointer;
  transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{opacity:.88;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:var(--accent);color:var(--text);}

/* ── Loading state ─────────────────────────────────────────── */
#loading{max-width:680px;margin:0 auto;padding:64px 24px;text-align:center;display:none;}
#loading.show{display:block;}
.spinner{width:42px;height:42px;border:3px solid rgba(108,124,242,.2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-step{color:var(--muted);font-size:.85rem;margin-bottom:8px;font-family:'JetBrains Mono',monospace;}
.load-progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.load-progress .step-chip{font-size:.62rem;padding:3px 9px;border-radius:8px;background:var(--surface);color:var(--muted2);border:1px solid var(--border);}
.load-progress .step-chip.active{background:rgba(108,124,242,.15);color:var(--accent);border-color:var(--accent);}
.load-progress .step-chip.done{background:rgba(91,240,156,.1);color:var(--green);border-color:rgba(91,240,156,.3);}

/* ── Report ────────────────────────────────────────────────── */
#report{max-width:1180px;margin:0 auto;padding:24px;display:none;}
#report.show{display:block;}

/* BL header strip */
.bl-strip{
  background:linear-gradient(135deg, rgba(108,124,242,.08), rgba(176,91,240,.05));
  border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.bl-strip .left .title{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
.bl-strip .left .meta{font-size:.78rem;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;}
.bl-strip .left .meta span strong{color:var(--text);}
.bl-strip .right{font-size:.7rem;color:var(--muted);text-align:right;}
.bl-strip .right .source{display:inline-flex;align-items:center;gap:5px;
  background:rgba(91,240,156,.08);color:var(--green);
  padding:3px 8px;border-radius:6px;font-weight:700;font-size:.62rem;
  letter-spacing:.06em;margin-top:4px;}

/* Verdict banner */
.verdict{
  border-radius:16px;padding:28px 32px;margin-bottom:24px;
  display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;
  border:1px solid;
}
.verdict.sev-0{background:linear-gradient(135deg,rgba(91,240,156,.06),rgba(91,240,156,.02));border-color:rgba(91,240,156,.25);}
.verdict.sev-1{background:linear-gradient(135deg,rgba(240,212,91,.06),rgba(240,212,91,.02));border-color:rgba(240,212,91,.3);}
.verdict.sev-2{background:linear-gradient(135deg,rgba(240,156,91,.08),rgba(240,156,91,.02));border-color:rgba(240,156,91,.3);}
.verdict.sev-3{background:linear-gradient(135deg,rgba(240,91,91,.08),rgba(240,91,91,.02));border-color:rgba(240,91,91,.32);}
.verdict-count{
  font-size:5rem;font-weight:900;line-height:.9;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.verdict.sev-0 .verdict-count{color:var(--green);}
.verdict.sev-1 .verdict-count{color:var(--yellow);}
.verdict.sev-2 .verdict-count{color:var(--orange);}
.verdict.sev-3 .verdict-count{color:var(--red);}
.verdict-count-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:6px;}
.verdict h2{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.verdict p{font-size:.92rem;color:var(--muted);line-height:1.55;}
.active-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.act-pill{font-size:.65rem;padding:3px 9px;border-radius:8px;font-weight:700;letter-spacing:.04em;border:1px solid;}

/* Primary fix card */
.primary-fix-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px 26px;margin-bottom:24px;display:flex;gap:20px;align-items:flex-start;
}
.primary-fix-card .pf-icon{
  width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;flex-shrink:0;
}
.primary-fix-card .pf-body{flex:1;min-width:0;}
.primary-fix-card .pf-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:5px;}
.primary-fix-card .pf-headline{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.primary-fix-card .pf-fix{font-size:.9rem;line-height:1.6;color:var(--text);}

/* Bucket grid */
.section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:30px 0 14px;font-weight:700;}
.bucket-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.bucket{
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:18px 20px;display:flex;flex-direction:column;gap:12px;
  cursor:pointer;transition:transform .15s,border-color .15s,background .15s;
  position:relative;overflow:hidden;
}
.bucket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor;opacity:.6;}
.bucket:hover{transform:translateY(-2px);}
.bucket.active{border-color:rgba(255,255,255,.15);}
.bucket.expanded{cursor:default;}
.bucket .b-head{display:flex;align-items:center;justify-content:space-between;}
.bucket .b-id{
  font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;
  background:rgba(255,255,255,.07);color:var(--muted);font-family:'JetBrains Mono',monospace;
}
.bucket.active .b-id{background:rgba(255,255,255,.1);color:currentColor;}
.bucket .b-name{font-size:.82rem;font-weight:700;color:var(--text);margin-top:4px;}
.bucket .b-bar-wrap{position:relative;height:6px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
.bucket .b-bar{height:100%;background:currentColor;border-radius:4px;transition:width .6s ease;}
.bucket .b-conf{font-family:'JetBrains Mono',monospace;font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.bucket .b-conf-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between;}
.bucket .b-conf-tag{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.bucket .b-conf-tag.active{color:currentColor;font-weight:700;}
.bucket .b-fix{font-size:.78rem;color:var(--muted);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bucket.expanded .b-fix{-webkit-line-clamp:unset;}
.b-detail{display:none;border-top:1px solid var(--border);margin-top:6px;padding-top:12px;}
.bucket.expanded .b-detail{display:block;}
.b-detail .b-reasoning{font-size:.78rem;color:var(--text);line-height:1.65;background:rgba(0,0,0,.18);padding:10px 12px;border-radius:8px;margin-bottom:10px;}
.b-detail .b-meta{font-size:.7rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:14px;}
.b-detail .b-meta b{color:var(--text);font-weight:600;}

/* Footer info bar */
.footer-bar{
  margin-top:28px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;font-size:.7rem;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;
}
.footer-bar strong{color:var(--text);}
.footer-bar .pulled-from{color:var(--green);font-weight:700;}

/* Tabs */
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;}
.tab{background:transparent;border:none;color:var(--muted);padding:11px 18px;font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;font-family:inherit;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab .tab-i{width:20px;height:20px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:.65rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);}
.tab.active .tab-i{background:var(--accent);color:#fff;border-color:var(--accent);}
.tab-badge{font-size:.6rem;padding:1px 7px;border-radius:8px;background:rgba(240,91,91,.15);color:var(--red);font-weight:700;}
.tab-badge.muted{background:var(--surface2);color:var(--muted);}

/* Purchase banner */
.purchase-banner{padding:12px 18px;border-radius:11px;font-size:.86rem;line-height:1.55;margin-bottom:20px;border:1px solid;}
.purchase-banner strong{margin-right:6px;letter-spacing:.02em;}
.purchase-banner.ok{background:rgba(91,240,156,.07);border-color:rgba(91,240,156,.22);color:var(--green);}
.purchase-banner.warn{background:rgba(240,212,91,.06);border-color:rgba(240,212,91,.22);color:var(--yellow);}
.purchase-banner.unknown{background:var(--surface2);border-color:var(--border);color:var(--muted);}
.pb-buyer{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(91,240,156,.18);border-radius:8px;padding:5px 11px;font-size:.78rem;color:var(--text);}
.pb-buyer strong{color:var(--green);font-weight:700;}
.pb-tag{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:5px;font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.pb-date{font-size:.7rem;color:var(--muted);}

/* Overview tab */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.overview-grid .spec-card-wrap{grid-column:1/-1;}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:18px 20px;}
.ov-title{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:14px;}
.ov-rows{display:flex;flex-direction:column;gap:9px;}
.ov-row{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:baseline;}
.ov-row .ov-k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.ov-row .ov-v{font-size:.85rem;color:var(--text);font-weight:500;}
.ov-tag{display:inline-block;font-size:.65rem;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-right:4px;border:1px solid var(--border);}
.ov-tag.match{background:rgba(91,240,156,.1);color:var(--green);border-color:rgba(91,240,156,.3);font-weight:600;}
.ov-tag.dim{opacity:.55;}
.ov-specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
.ov-spec{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
.ov-spec.filled{border-color:rgba(91,240,156,.25);background:rgba(91,240,156,.04);}
.ov-spec-name{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px;}
.ov-spec-val{font-size:.78rem;color:var(--text);font-weight:500;}
@media(max-width:740px){.overview-grid{grid-template-columns:1fr;}.ov-row{grid-template-columns:96px 1fr;}}

/* Astbuy tab */
.astbuy-info{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 18px;margin-bottom:18px;font-size:.82rem;color:var(--muted);line-height:1.6;}
.astbuy-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.ov-stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.ov-stat-v{font-size:1.5rem;font-weight:800;color:var(--text);font-family:'JetBrains Mono',monospace;}
.ov-stat-v.ok{color:var(--green);} .ov-stat-v.bad{color:var(--red);} .ov-stat-v.warn{color:var(--yellow);}
.ov-stat-l{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
.astbuy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.astbuy-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.ab-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;}
.ab-rank{font-size:.7rem;font-weight:800;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px 8px;}
.ab-comp{font-size:.88rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ab-sub{font-size:.66rem;color:var(--muted);margin-top:2px;}
.ab-alert{font-size:.62rem;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.04em;}
.ab-A{background:rgba(91,240,156,.12);color:var(--green);} .ab-B{background:rgba(240,212,91,.1);color:var(--yellow);} .ab-C{background:rgba(240,91,91,.1);color:var(--red);}
.ab-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;padding-top:10px;border-top:1px solid var(--border);}
.ab-mv{font-size:.92rem;font-weight:700;font-family:'JetBrains Mono',monospace;}
.ab-mv.ok{color:var(--green);} .ab-mv.bad{color:var(--red);} .ab-mv.warn{color:var(--yellow);}
.ab-ml{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.ab-cities{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.ab-chip{font-size:.6rem;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);}
.ab-chip.match{background:rgba(108,124,242,.15);color:var(--accent);font-weight:700;}
.astbuy-empty{background:var(--surface2);border:1px dashed var(--border);border-radius:11px;padding:24px;text-align:center;color:var(--muted);font-size:.84rem;}

/* Purchasers card */
.purchaser-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.purchaser-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:9px;padding:12px 14px;}
.pc-name{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.pc-tag{display:inline-block;font-size:.58rem;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:8px;letter-spacing:.04em;}
.pc-row{display:flex;gap:6px;font-size:.7rem;color:var(--muted);margin-top:5px;flex-wrap:wrap;align-items:center;}
.pc-row .k{color:var(--muted2);}
.pc-row .v{color:var(--text);font-weight:600;}
.pc-row .v.alert-A{color:var(--green);}
.pc-row .v.alert-B{color:var(--yellow);}
.pc-row .v.alert-C{color:var(--red);}
.pc-cities{font-size:.62rem;margin-top:8px;display:flex;flex-wrap:wrap;gap:3px;}
.pc-cities .chip{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--muted);}
.pc-cities .chip.match{background:rgba(108,124,242,.12);border-color:var(--accent);color:var(--accent);font-weight:700;}

/* Actionable tab */
.actionable-wrap{display:flex;flex-direction:column;gap:14px;}
.act-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:22px 26px;}
.act-headline{background:linear-gradient(135deg,rgba(108,124,242,.07),rgba(176,91,240,.04));border-color:rgba(108,124,242,.25);}
.act-eyebrow{font-size:.62rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:8px;font-weight:700;}
.act-h{font-size:1.55rem;font-weight:800;letter-spacing:-.018em;line-height:1.32;color:var(--text);}
.act-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.act-pill{font-size:.66rem;font-weight:700;padding:4px 10px;border-radius:9px;letter-spacing:.04em;border:1px solid transparent;}
.act-pill.ok{background:rgba(91,240,156,.1);color:var(--green);border-color:rgba(91,240,156,.25);}
.act-pill.warn{background:rgba(240,212,91,.1);color:var(--yellow);border-color:rgba(240,212,91,.25);}
.act-pill.conf{background:rgba(108,124,242,.1);color:var(--accent);border-color:rgba(108,124,242,.25);}
.act-pill.sev0{background:rgba(91,240,156,.08);color:var(--green);}
.act-pill.sev1{background:rgba(240,212,91,.1);color:var(--yellow);}
.act-pill.sev2{background:rgba(240,156,91,.1);color:var(--orange);}
.act-pill.sev3{background:rgba(240,91,91,.1);color:var(--red);}
.act-section-title{font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:12px;}
.act-detail{font-size:.92rem;line-height:1.7;color:var(--text);}
.act-detail.muted{color:var(--muted);font-size:.83rem;}
.act-detail p{margin:0 0 10px;}.act-detail p:last-child{margin-bottom:0;}
.act-items{display:flex;flex-direction:column;gap:10px;}
.act-item{display:flex;gap:14px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:11px;padding:14px 16px;}
.act-item-rank{width:30px;height:30px;border-radius:50%;background:rgba(108,124,242,.15);color:var(--accent);font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(108,124,242,.3);}
.act-item-body{flex:1;min-width:0;}
.act-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px;flex-wrap:wrap;}
.act-item-label{font-size:.95rem;font-weight:700;color:var(--text);}
.act-item-impact{font-size:.6rem;padding:2px 8px;border-radius:6px;letter-spacing:.04em;font-weight:700;text-transform:uppercase;}
.act-item-impact.high{background:rgba(240,91,91,.1);color:var(--red);}
.act-item-impact.med{background:rgba(240,156,91,.1);color:var(--orange);}
.act-item-impact.low{background:rgba(91,240,156,.08);color:var(--green);}
.act-item-detail{font-size:.83rem;color:var(--muted);line-height:1.6;}
.act-caveat{border-color:rgba(240,212,91,.18);background:rgba(240,212,91,.04);}
.act-empty{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:32px;text-align:center;}
.act-empty-title{font-size:.9rem;color:var(--text);font-weight:600;margin-bottom:6px;}
.act-empty-body{font-size:.78rem;color:var(--muted);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1e2030;border:1px solid var(--border);color:var(--text);
  padding:11px 20px;border-radius:10px;font-size:.82rem;opacity:0;transform:translateY(8px);
  transition:all .25s;pointer-events:none;z-index:200;max-width:340px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">R</div>
    <div>
      <h1>RCA Analysis</h1>
      <div class="sub">BuyLead Root-Cause Diagnostic · IndiaMART</div>
    </div>
  </div>
  <div class="status">
    <span class="dot" id="apiDot"></span>
    <span id="apiTxt">checking…</span>
    <button id="themeBtn" onclick="toggleTheme()" title="Toggle dark / light mode"
      style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);
             padding:6px 11px;border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:600;
             font-family:inherit;display:inline-flex;align-items:center;gap:6px;margin-left:6px;">
      <span id="themeIcon">🌙</span><span id="themeLbl">Dark</span>
    </button>
  </div>
</header>

<form class="input-row" onsubmit="event.preventDefault();runByOffer()">
  <input id="offerInput" type="text" inputmode="numeric" placeholder="Enter BuyLead ID (e.g. 144220567946)" value="144220567946" autocomplete="off"/>
  <button class="btn" id="runBtn" type="submit">Run RCA →</button>
  <a class="btn btn-outline" href="/" style="text-decoration:none">Classic view</a>
</form>

<div id="loading">
  <div class="spinner"></div>
  <div class="load-step" id="loadStep">Initialising…</div>
  <div class="load-progress" id="loadProgress"></div>
</div>

<div id="report"></div>
<div class="toast" id="toast"></div>

<script>
const API = '';   // same-origin (served by FastAPI)
const ACTIVE_THRESHOLD = 40;

const BC = {
  MCAT_MISMATCH:       {fill:'#5b9cf0', label:'MCAT Mismatch',       id:'B1'},
  THIN_CONTENT:        {fill:'#f09c5b', label:'Thin Content',        id:'B2'},
  SPEC_CONTRADICTION:  {fill:'#b05bf0', label:'Spec Contradiction',  id:'B3'},
  LOW_BUYER_INTENT:    {fill:'#f0d45b', label:'Low Buyer Intent',    id:'B4'},
  SPEC_VALUE_QUALITY:  {fill:'#5bf0d4', label:'Spec Value Quality',  id:'B5'},
  QUANTITY_MISMATCH:   {fill:'#f05bd4', label:'Quantity Mismatch',   id:'B6'},
  RETAIL_QUERY:        {fill:'#a0a8c6', label:'Retail Query',        id:'B7'},
};

const SKILL_KEY = {
  MCAT_MISMATCH:'mcat',          THIN_CONTENT:'content',
  SPEC_CONTRADICTION:'spec',     LOW_BUYER_INTENT:'intent',
  SPEC_VALUE_QUALITY:'spec_quality',
  QUANTITY_MISMATCH:'quantity',  RETAIL_QUERY:'retail',
};

const STEPS = [
  'Fetching BL data from Redash',
  'Checking purchased status',
  'Loading buyer profile',
  'Loading astbuy seller pool',
  'Loading MCAT spec catalog',
  'Loading 90-day sold-BL benchmark',
  'B1: MCAT mismatch check',
  'B2-B7: bucket analysis (parallel)',
  'Synthesising verdict',
];

function applyTheme(t) {
  document.body.setAttribute('data-theme', t);
  const isLight = t === 'light';
  const icon = document.getElementById('themeIcon');
  const lbl = document.getElementById('themeLbl');
  if (icon) icon.textContent = isLight ? '☀' : '🌙';
  if (lbl) lbl.textContent = isLight ? 'Light' : 'Dark';
}
function toggleTheme() {
  const next = (document.body.getAttribute('data-theme') === 'light') ? 'dark' : 'light';
  localStorage.setItem('blrca_theme', next);
  applyTheme(next);
}
applyTheme(localStorage.getItem('blrca_theme') || 'dark');

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`,{signal:AbortSignal.timeout(3000)});
    if(r.ok){document.getElementById('apiDot').className='dot ok';document.getElementById('apiTxt').textContent='connected';}
    else throw 0;
  } catch { document.getElementById('apiTxt').textContent='API offline'; }
}
checkHealth();

async function runByOffer() {
  const v = (document.getElementById('offerInput').value || '').trim();
  if(!/^\d+$/.test(v)) { toast('Enter a numeric BuyLead ID', true); return; }

  document.getElementById('report').classList.remove('show');
  const loading = document.getElementById('loading');
  loading.classList.add('show');
  document.getElementById('runBtn').disabled = true;

  // Animate the step list
  const stepEl = document.getElementById('loadStep');
  const progEl = document.getElementById('loadProgress');
  progEl.innerHTML = STEPS.map((s,i)=>`<span class="step-chip" id="sc${i}">${s.replace(/^B\d.*?:\s*/,'')}</span>`).join('');
  let si = 0;
  stepEl.textContent = STEPS[0];
  document.getElementById('sc0').classList.add('active');
  const t = setInterval(()=>{
    document.getElementById('sc'+si)?.classList.remove('active');
    document.getElementById('sc'+si)?.classList.add('done');
    si = (si+1) % STEPS.length;
    document.getElementById('sc'+si)?.classList.add('active');
    stepEl.textContent = STEPS[si];
  }, 1400);

  try {
    const res = await fetch(`${API}/report/by-offer/${v}`);
    clearInterval(t);
    if(!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Request failed'); }
    const data = await res.json();
    render(data);
    loading.classList.remove('show');
    document.getElementById('report').classList.add('show');
    toast(`Verdict ready — ${data.rca.overlap_count || 0} active issue${data.rca.overlap_count===1?'':'s'}`);
  } catch(e) {
    clearInterval(t);
    loading.classList.remove('show');
    toast('Error: '+e.message, true);
  } finally {
    document.getElementById('runBtn').disabled = false;
  }
}

function render(data) {
  const {report, rca, skill_results, actionable, data_sources, timings} = data;
  const bl = report.bl;
  const astbuy = report.astbuy_sellers || report.sellers || [];
  document.getElementById('report').innerHTML = `
    ${renderStrip(bl, data_sources, rca)}
    ${renderPurchaseBanner(bl)}
    ${renderTabBar(astbuy.length, rca.overlap_count||0)}
    <div class="tab-panel" data-tab="actionable">
      ${renderActionable(actionable, rca, bl)}
    </div>
    <div class="tab-panel" data-tab="overview" style="display:none">
      ${renderOverview(report, skill_results)}
    </div>
    <div class="tab-panel" data-tab="diagnosis" style="display:none">
      ${renderVerdict(rca)}
      ${rca.primary_bucket ? renderPrimaryFix(rca) : ''}
      <div class="section-title">All 7 buckets · click any to expand</div>
      ${renderBuckets(rca, skill_results)}
    </div>
    <div class="tab-panel" data-tab="astbuy" style="display:none">
      ${renderAstbuy(astbuy, report.pool_signals, report.buyer.city)}
    </div>
    ${renderFooter(rca, timings)}
  `;
}

function renderTabBar(astbuyCount, overlap) {
  return `<div class="tab-bar">
    <button class="tab active" onclick="switchTab(this,'actionable')">
      <span class="tab-i">★</span><span>Actionable</span>
    </button>
    <button class="tab" onclick="switchTab(this,'overview')">
      <span class="tab-i">1</span><span>General Info</span>
    </button>
    <button class="tab" onclick="switchTab(this,'diagnosis')">
      <span class="tab-i">2</span><span>Bucket Diagnosis</span>
      ${overlap>0?`<span class="tab-badge">${overlap}</span>`:''}
    </button>
    <button class="tab" onclick="switchTab(this,'astbuy')">
      <span class="tab-i">3</span><span>Astbuy Sellers</span>
      ${astbuyCount>0?`<span class="tab-badge muted">${astbuyCount}</span>`:''}
    </button>
  </div>`;
}

function renderActionable(a, rca, bl) {
  if (!a || a.error) {
    return `<div class="act-empty">
      <div class="act-empty-title">Final actionable couldn't be generated</div>
      <div class="act-empty-body">${a?.error ? escapeHtml(a.error) : 'The synthesis LLM call failed. See Bucket Diagnosis tab for raw bucket verdicts.'}</div>
    </div>`;
  }
  const headline = a.root_cause_headline || rca.overlap_summary || 'No headline produced.';
  const detail = a.root_cause_detail || '';
  const items = a.action_items || [];
  const conf = a.confidence;
  const caveats = a.caveats || '';
  const purchasedBadge = bl.was_purchased
    ? `<span class="act-pill ok">BL was purchased</span>`
    : `<span class="act-pill warn">BL not purchased</span>`;

  return `<div class="actionable-wrap">
    <div class="act-card act-headline">
      <div class="act-eyebrow">Root cause · synthesised by LLM from every signal</div>
      <h2 class="act-h">${escapeHtml(headline)}</h2>
      <div class="act-meta">
        ${purchasedBadge}
        ${conf!=null?`<span class="act-pill conf">Confidence ${conf}%</span>`:''}
        <span class="act-pill ${(rca.overlap_count||0)>=3?'sev3':(rca.overlap_count||0)>=2?'sev2':(rca.overlap_count||0)>=1?'sev1':'sev0'}">${rca.overlap_count||0} active bucket${rca.overlap_count===1?'':'s'}</span>
      </div>
    </div>

    ${detail ? `<div class="act-card">
      <div class="act-section-title">Why this happened</div>
      <div class="act-detail">${escapeHtml(detail).split(/\\n\\n+/).map(p=>`<p>${p}</p>`).join('')}</div>
    </div>` : ''}

    ${items.length ? `<div class="act-card">
      <div class="act-section-title">Action items · ordered by impact</div>
      <div class="act-items">${items.map(it=>renderActionItem(it)).join('')}</div>
    </div>` : ''}

    ${caveats ? `<div class="act-card act-caveat">
      <div class="act-section-title">Caveats</div>
      <div class="act-detail muted">${escapeHtml(caveats)}</div>
    </div>` : ''}
  </div>`;
}

function renderActionItem(it) {
  const impact = (it.impact||'Medium').toLowerCase();
  const impCls = impact.startsWith('high')?'high':impact.startsWith('low')?'low':'med';
  return `<div class="act-item">
    <div class="act-item-rank">${it.priority||'•'}</div>
    <div class="act-item-body">
      <div class="act-item-head">
        <span class="act-item-label">${escapeHtml(it.label||'Action')}</span>
        <span class="act-item-impact ${impCls}">${escapeHtml(it.impact||'Medium')} impact</span>
      </div>
      <div class="act-item-detail">${escapeHtml(it.detail||'')}</div>
    </div>
  </div>`;
}

function switchTab(btn, name) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>{
    p.style.display = (p.dataset.tab === name) ? 'block' : 'none';
  });
}

function renderPurchaseBanner(bl) {
  if (!bl) return '';
  const purchased = bl.was_purchased;
  const status = bl.purchased_status || 'Unknown';
  const n = bl.purchase_count || 0;
  const buyers = bl.purchasing_sellers || [];
  if (purchased) {
    const buyerList = buyers.length
      ? `<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;">${buyers.map(s => `
          <span class="pb-buyer">
            <strong>${escapeHtml(s.company || '—')}</strong>
            <span class="pb-tag">${escapeHtml(s.custtype_name || '?')}</span>
            ${s.purchased_at ? `<span class="pb-date">${(s.purchased_at||'').split('T')[0]}</span>` : ''}
          </span>`).join('')}</div>`
      : `<div style="margin-top:6px;font-size:.78rem;color:var(--muted)">Buyer details not retained (archived warehouse).</div>`;
    return `<div class="purchase-banner ok">
      <strong>Purchased</strong> · this BL was bought by ${n} seller${n===1?'':'s'}. RCA below is post-hoc.
      ${buyerList}
    </div>`;
  }
  if (status === 'Not Purchased') {
    return `<div class="purchase-banner warn">
      <strong>Not Purchased</strong> · no buyer found in eto_lead_pur_hist / iil_lead_pur_hist. RCA applies.
    </div>`;
  }
  return `<div class="purchase-banner unknown"><strong>Status unknown</strong></div>`;
}

function renderOverview(report, skills) {
  const bl = report.bl;
  const b = report.buyer || {};
  const intent = (skills?.intent) || {};
  const enqLabel = bl.retail_flag === 1 ? 'Retail' : bl.retail_flag === 2 ? 'B2B' : bl.retail_flag === 3 ? 'Auto-Retail' : '—';

  const specsBox = (bl.specs_form || []).map(s => {
    const filled = s.is_filled;
    const star = s.priority <= 2 ? '★'.repeat(3 - s.priority) : '';
    const isQty = /^quantity( unit)?$/i.test(s.name);
    let val;
    if (isQty) {
      val = filled ? `<span style="font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:700">${escapeHtml(s.buyer_value)}</span>` : `<span style="color:var(--muted2);font-style:italic">—</span>`;
    } else {
      val = filled ? escapeHtml(s.buyer_value) : `<span style="color:var(--muted2);font-style:italic">not filled</span>`;
    }
    return `<div class="ov-spec ${filled?'filled':'empty'}">
      <div class="ov-spec-name">${star?`<span style="color:var(--yellow)">${star}</span> `:''}${escapeHtml(s.name)}</div>
      <div class="ov-spec-val">${val}</div>
    </div>`;
  }).join('');

  const purchasers = bl.purchasing_sellers || [];
  const purchasersCard = purchasers.length ? `
    <div class="ov-card spec-card-wrap" style="border-color:rgba(91,240,156,.25);background:linear-gradient(135deg,rgba(91,240,156,.04),transparent)">
      <div class="ov-title">Purchased by · ${purchasers.length} seller${purchasers.length===1?'':'s'} — real transaction</div>
      <div class="purchaser-grid">${purchasers.map(s => {
        const alertLetter = (s.eto_trd_alert_rank || '').toString().toUpperCase()[0] || '';
        const cities = (s.a_rank_preferred_cities || '').split(',').map(c=>c.trim()).filter(Boolean).slice(0,6);
        const bcl = (b.city || '').toString().toLowerCase();
        const purDate = (s.purchased_at || '').toString().split('T')[0];
        return `<div class="purchaser-card">
          <div class="pc-name">${escapeHtml(s.company || '—')}<span class="pc-tag">${escapeHtml(s.custtype_name || '?')}</span></div>
          <div class="pc-row"><span class="k">Bought</span><span class="v">${purDate || '—'}</span></div>
          <div class="pc-row"><span class="k">Alert</span><span class="v alert-${alertLetter}">${s.eto_trd_alert_rank || '—'}${s.eto_trd_alert_subrank?` / ${s.eto_trd_alert_subrank}`:''}</span></div>
          <div class="pc-row"><span class="k">BLs / yr</span><span class="v">${s.total_bl_purchased_1yr ?? 0}</span></div>
          <div class="pc-row"><span class="k">City match</span><span class="v">${s.city_match?'✓ yes':'✗ no'}</span></div>
          ${cities.length?`<div class="pc-cities">${cities.map(c=>`<span class="chip ${c.toLowerCase()===bcl?'match':''}">${escapeHtml(c)}</span>`).join('')}</div>`:''}
        </div>`;
      }).join('')}</div>
    </div>` : '';

  return `<div class="overview-grid">
    ${purchasersCard}
    <div class="ov-card">
      <div class="ov-title">BuyLead Header</div>
      <div class="ov-rows">
        <div class="ov-row"><span class="ov-k">Title</span><span class="ov-v">${escapeHtml(bl.offer_name)}</span></div>
        <div class="ov-row"><span class="ov-k">MCAT</span><span class="ov-v">${escapeHtml(bl.mcat_name||'—')} ${bl.mapped_mcat_id?`<span style="color:var(--muted)">· ${bl.mapped_mcat_id}</span>`:''}</span></div>
        <div class="ov-row"><span class="ov-k">Approved</span><span class="ov-v">${(bl.approval_date||'').split('T')[0]||'—'}</span></div>
        <div class="ov-row"><span class="ov-k">Enq Type</span><span class="ov-v">${enqLabel}</span></div>
        <div class="ov-row"><span class="ov-k">AOV</span><span class="ov-v">${escapeHtml(bl.probable_order_value||'—')}</span></div>
        <div class="ov-row"><span class="ov-k">Req Type</span><span class="ov-v">${escapeHtml(bl.probable_req_type||'—')}</span></div>
        <div class="ov-row"><span class="ov-k">Specs filled</span><span class="ov-v">${bl.specs_fill_count}/${bl.total_spec_count}</span></div>
      </div>
    </div>
    <div class="ov-card">
      <div class="ov-title">Buyer Profile</div>
      <div class="ov-rows">
        <div class="ov-row"><span class="ov-k">Company</span><span class="ov-v">${escapeHtml(b.company||'—')}</span></div>
        <div class="ov-row"><span class="ov-k">Contact</span><span class="ov-v">${escapeHtml(b.contact||'—')} ${b.designation && b.designation!=='—' ? `<span style="color:var(--muted)">· ${escapeHtml(b.designation)}</span>` : ''}</span></div>
        <div class="ov-row"><span class="ov-k">Location</span><span class="ov-v">${escapeHtml(b.city||'—')}, ${escapeHtml(b.state||'—')}</span></div>
        <div class="ov-row"><span class="ov-k">Verified</span><span class="ov-v">${[b.gst_verified?'GST':null, b.mobile_verified?'Mobile':null, b.email_verified?'Email':null].filter(Boolean).join(' · ') || '<span style="color:var(--red)">none</span>'}</span></div>
        <div class="ov-row"><span class="ov-k">Total leads</span><span class="ov-v">${b.total_leads ?? '—'}${b.first_time_buyer?' <span style="color:var(--yellow)">· first-time</span>':''}</span></div>
        <div class="ov-row"><span class="ov-k">Prime MCATs</span><span class="ov-v">${(b.prime_mcats||[]).map(m=>`<span class="ov-tag ${b.buyer_in_prime_mcat && m.toLowerCase()===bl.mcat_name?.toLowerCase()?'match':''}">${escapeHtml(m)}</span>`).join('') || '—'}</span></div>
        <div class="ov-row"><span class="ov-k">Also sells</span><span class="ov-v">${(b.sell_mcats||[]).map(m=>`<span class="ov-tag dim">${escapeHtml(m)}</span>`).join('') || '—'}</span></div>
        ${b.buyer_in_prime_mcat ? `<div class="ov-row"><span class="ov-k"></span><span class="ov-v" style="color:var(--green);font-size:.75rem">✓ Buying in own line of business (prime MCAT)</span></div>` : ''}
      </div>
    </div>
    <div class="ov-card spec-card-wrap">
      <div class="ov-title">Spec Form · ${bl.specs_fill_count}/${bl.total_spec_count} filled</div>
      <div class="ov-specs">${specsBox || '<div style="color:var(--muted);font-size:.8rem">No catalog specs found for this MCAT.</div>'}</div>
    </div>
  </div>`;
}

function renderAstbuy(sellers, pool, buyerCity) {
  const total = pool?.total_sellers || sellers?.length || 0;
  const cityMatch = pool?.city_match_count ?? 0;
  const withHist = pool?.with_history_count ?? 0;
  const mcatMatch = pool?.mcat_match_count ?? 0;

  let html = `<div class="astbuy-info">
    <strong style="color:var(--text)">What this is: </strong>
    these ${total} sellers were selected by IndiaMART to chase this unsold BL via phone (astbuy routing).
    They are NOT the original recommended-seller pool — informational only, separate from the RCA verdict.
  </div>
  <div class="astbuy-stats">
    <div class="ov-stat"><div class="ov-stat-v">${total}</div><div class="ov-stat-l">Pool size</div></div>
    <div class="ov-stat"><div class="ov-stat-v ${mcatMatch>0?'ok':'bad'}">${mcatMatch}/${total}</div><div class="ov-stat-l">MCAT match</div></div>
    <div class="ov-stat"><div class="ov-stat-v ${cityMatch>0?'ok':'bad'}">${cityMatch}/${total}</div><div class="ov-stat-l">City match</div></div>
    <div class="ov-stat"><div class="ov-stat-v ${withHist>0?'ok':'bad'}">${withHist}/${total}</div><div class="ov-stat-l">Has BL history</div></div>
  </div>`;

  if (total === 0) {
    return html + `<div class="astbuy-empty">No astbuy sellers were routed for this BL (or data was purged for an archived offer).</div>`;
  }

  const bcl = (buyerCity || '').toLowerCase();
  html += `<div class="astbuy-grid">`;
  for (const s of sellers) {
    const alertLetter = (s.alert_rank || 'C').toUpperCase()[0];
    html += `<div class="astbuy-card">
      <div class="ab-head">
        <span class="ab-rank">#${s.rank||'?'}</span>
        <div style="flex:1;min-width:0">
          <div class="ab-comp">${escapeHtml(s.company)}</div>
          <div class="ab-sub">${escapeHtml(s.membership||'—')} · since ${(s.member_since||'—').toString().split('T')[0]||'—'}</div>
        </div>
        <span class="ab-alert ab-${alertLetter}">${s.alert_rank||'?'}${s.alert_subrank||''}</span>
      </div>
      <div class="ab-grid">
        <div><div class="ab-mv ${s.mcat_match?'ok':'bad'}">${s.mcat_match?'YES':'NO'}</div><div class="ab-ml">MCAT</div></div>
        <div><div class="ab-mv ${s.bl_purchased_1yr>=10?'ok':s.bl_purchased_1yr>0?'warn':'bad'}">${s.bl_purchased_1yr}</div><div class="ab-ml">BL/yr</div></div>
        <div><div class="ab-mv ${s.distance_km==0?'ok':s.distance_km>200?'bad':'warn'}">${s.distance_km==null?'—':s.distance_km===0?'Local':s.distance_km+'km'}</div><div class="ab-ml">Distance</div></div>
        <div><div class="ab-mv">${s.quality_score||0}</div><div class="ab-ml">Quality</div></div>
      </div>
      ${s.preferred_cities?.length ? `<div class="ab-cities">${s.preferred_cities.map(c=>`<span class="ab-chip ${c.toLowerCase()===bcl?'match':''}">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderStrip(bl, ds, rca) {
  return `<div class="bl-strip">
    <div class="left">
      <div class="title">${escapeHtml(bl.offer_name)}</div>
      <div class="meta">
        <span><strong>${escapeHtml(bl.mcat_name||'—')}</strong> · MCAT</span>
        <span>Offer <strong>${bl.offer_id}</strong></span>
        ${bl.probable_order_value ? `<span>AOV <strong>${escapeHtml(bl.probable_order_value)}</strong></span>` : ''}
        ${bl.probable_req_type ? `<span>Req <strong>${escapeHtml(bl.probable_req_type)}</strong></span>` : ''}
        <span>${bl.specs_fill_count}/${bl.total_spec_count} specs</span>
      </div>
    </div>
    <div class="right">
      <div>Run · ${rca.run_id || '—'}</div>
      <div class="source">${(ds?.source || 'unknown').toUpperCase()}</div>
    </div>
  </div>`;
}

function renderVerdict(rca) {
  const n = rca.overlap_count || 0;
  const sev = n>=3 ? 'sev-3' : n>=2 ? 'sev-2' : n>=1 ? 'sev-1' : 'sev-0';
  const headline = n===0
    ? 'No significant issues detected'
    : n===1
      ? `1 root cause identified`
      : `${n} overlapping issues identified`;
  const subhead = n===0
    ? 'This BL does not show signs of the eight common failure patterns. Investigate channel-specific factors.'
    : `Primary: <strong style="color:${BC[rca.primary_bucket]?.fill}">${BC[rca.primary_bucket]?.label||rca.primary_bucket}</strong> at ${rca.primary_confidence}% confidence.${rca.secondary_bucket ? ` Secondary: <strong style="color:${BC[rca.secondary_bucket]?.fill}">${BC[rca.secondary_bucket]?.label}</strong> at ${rca.secondary_confidence}%.` : ''}`;
  const pills = (rca.active_buckets || []).map(ab => {
    const c = BC[ab.bucket] || {};
    return `<span class="act-pill" style="color:${c.fill};border-color:${c.fill};background:${c.fill}11">${c.id} · ${ab.confidence}%</span>`;
  }).join('');
  return `<div class="verdict ${sev}">
    <div>
      <div class="verdict-count">${n}</div>
      <div class="verdict-count-lbl">active issue${n===1?'':'s'}</div>
    </div>
    <div>
      <h2>${headline}</h2>
      <p>${subhead}</p>
      ${pills ? `<div class="active-pills">${pills}</div>` : ''}
    </div>
  </div>`;
}

function renderPrimaryFix(rca) {
  const c = BC[rca.primary_bucket] || {};
  return `<div class="primary-fix-card" style="border-left:3px solid ${c.fill}">
    <div class="pf-icon" style="background:${c.fill}22;color:${c.fill}">${c.id}</div>
    <div class="pf-body">
      <div class="pf-lbl">Recommended Action · ${c.label}</div>
      <div class="pf-headline">Confidence ${rca.primary_confidence}%</div>
      <div class="pf-fix">${escapeHtml(rca.primary_fix || '—')}</div>
    </div>
  </div>`;
}

function renderBuckets(rca, skills) {
  // Show ALL buckets (active first, then inactive — all expandable).
  const entries = Object.entries(rca.bucket_scores || {})
    .map(([b, s])=>({b, s, active: s > ACTIVE_THRESHOLD}))
    .sort((a, z)=> (z.active - a.active) || (z.s - a.s));
  return `<div class="bucket-grid">${
    entries.map(e => bucketCard(e.b, e.s, e.active, skills, rca)).join('')
  }</div>`;
}

function bucketCard(bucket, score, active, skills, rca) {
  const c = BC[bucket] || {fill:'#666',label:bucket,id:'?'};
  const sr = skills[SKILL_KEY[bucket]] || {};
  const fix = (rca.all_bucket_fixes||{})[bucket] || sr.fix || '—';
  const reasoning = sr.reasoning || sr.combined_reasoning || sr.primary_failure_mode || '';
  const meta = bucketMeta(bucket, sr);
  return `<div class="bucket ${active?'active':''}" style="color:${c.fill}" onclick="this.classList.toggle('expanded')">
    <div class="b-head">
      <span class="b-id">${c.id}</span>
      <span class="b-conf-tag ${active?'active':''}">${active?'ACTIVE':'inactive'}</span>
    </div>
    <div>
      <div class="b-conf-row">
        <span class="b-conf" style="color:${active?c.fill:'var(--text)'}">${score}%</span>
        <span style="color:var(--muted);font-size:.7rem">${c.label}</span>
      </div>
    </div>
    <div class="b-bar-wrap"><div class="b-bar" style="width:${score}%"></div></div>
    <div class="b-fix">${escapeHtml(fix)}</div>
    <div class="b-detail">
      ${reasoning ? `<div class="b-reasoning"><b style="color:${c.fill}">Reasoning · </b>${escapeHtml(reasoning)}</div>` : ''}
      ${meta ? `<div class="b-meta">${meta}</div>` : ''}
    </div>
  </div>`;
}

function bucketMeta(bucket, sr) {
  // Per-bucket diagnostic snippets
  switch(bucket) {
    case 'MCAT_MISMATCH':
      return `<span><b>Mismatch:</b> ${sr.is_mismatch ? 'yes':'no'}</span>
              ${sr.suggested_mcat ? `<span><b>Suggested:</b> ${escapeHtml(sr.suggested_mcat)}</span>` : ''}`;
    case 'THIN_CONTENT':
      return `<span><b>Filled:</b> ${sr.fill_count}/${sr.total_specs} (${sr.fill_pct}%)</span>
              <span><b>Priority:</b> ${sr.priority_filled}/${sr.total_priority}</span>
              ${sr.thin_sold_bl_count!=null ? `<span><b>Thin sold (90d):</b> ${sr.thin_sold_bl_count}</span>` : ''}`;
    case 'SPEC_CONTRADICTION':
      const pairs = sr.contradicting_pairs?.length || 0;
      return `<span><b>Contradicting pairs:</b> ${pairs}</span>
              ${sr.out_of_catalog_count ? `<span><b>OOC specs:</b> ${sr.out_of_catalog_count}</span>` : ''}`;
    case 'LOW_BUYER_INTENT':
      return `<span><b>Verified:</b> ${sr.verification_score}/3</span>
              <span><b>Intent:</b> ${sr.intent_score}/100</span>
              <span><b>History:</b> ${escapeHtml(sr.lead_history||'—')}</span>
              ${sr.buyer_in_prime_mcat ? `<span style="color:var(--green)"><b>✓ Prime MCAT match</b></span>` : ''}`;
    case 'SELLER_SIDE_FAILURE':
      const pm = sr.pool_metrics || {};
      return `<span><b>Pool:</b> ${sr.pool_size||0} sellers</span>
              ${pm.with_credits?.label ? `<span><b>Have credits:</b> ${pm.with_credits.label}</span>` : ''}
              ${pm.city_match?.label ? `<span><b>City match:</b> ${pm.city_match.label}</span>` : ''}
              ${sr.primary_failure_mode ? `<span style="margin-top:6px;flex-basis:100%"><b>Mode:</b> ${escapeHtml(sr.primary_failure_mode)}</span>` : ''}`;
    case 'SPEC_VALUE_QUALITY':
      return `<span><b>Out-of-catalog:</b> ${sr.out_of_catalog_count||0}/${sr.total_filled||0}</span>
              ${sr.invalid_in_market!=null ? `<span><b>Invalid values:</b> ${sr.invalid_in_market}</span>` : ''}`;
    case 'QUANTITY_MISMATCH':
      return `<span><b>Retail qty:</b> ${sr.is_retail_quantity?'yes':'no'}</span>
              <span><b>AOV match:</b> ${sr.aov_quantity_mismatch?'mismatch':'ok'}</span>
              ${sr.aov ? `<span><b>AOV:</b> ${escapeHtml(sr.aov)}</span>` : ''}`;
    case 'RETAIL_QUERY':
      return `<span><b>Verdict:</b> ${sr.is_retail_query?'retail':'B2B'}</span>
              <span><b>Enq type:</b> ${escapeHtml(sr.enq_typ_label||'—')}</span>
              ${sr.rule_req_type_retail ? `<span style="color:var(--red)"><b>⚠ Personal use</b></span>` : ''}`;
    default:
      return '';
  }
}

function renderFooter(rca, timings) {
  const t = timings || {};
  return `<div class="footer-bar">
    <span>Total elapsed <strong>${rca.elapsed_secs ?? '—'}s</strong></span>
    ${t.total_secs ? `<span>Redash <strong>${t.total_secs}s</strong> (stage1 ${t.stage1_secs}s · stage2 ${t.stage2_secs}s)</span>` : ''}
    <span style="margin-left:auto">Run id <strong>${rca.run_id || '—'}</strong></span>
  </div>`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 3200);
}
</script>
</body>
</html>
